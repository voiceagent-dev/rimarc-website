# Builds the website and publishes it to GitHub Pages (www.rimarcai.com) on every push to main.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and pre-render pages
        run: npm run build -w client
        env:
          # Public address of the Google Apps Script that saves the forms to the leads sheet.
          VITE_LEADS_URL: https://script.google.com/macros/s/AKfycbysMjjYZ6tvH4ZuCGxr6t6yl8kcnoh7KX3ZOQD-K9ML2MPr9wlUAp1SoZAjsb-yxnrC/exec
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
